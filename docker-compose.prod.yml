# docker-compose.prod.yml
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:5.0
    container_name: idurar-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secure_password}
      MONGO_INITDB_DATABASE: idurar
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - idurar-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: idurar-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - idurar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: ${REGISTRY_USERNAME:-tonykuriakose}/idurar-backend:${IMAGE_TAG:-latest}
    container_name: idurar-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE: mongodb://admin:${MONGO_ROOT_PASSWORD:-secure_password}@mongodb:27017/idurar?authSource=admin
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-your-super-secure-jwt-secret}
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379
      PORT: 8000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - idurar-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend Application
  frontend:
    image: ${REGISTRY_USERNAME:-tonykuriakose}/idurar-frontend:${IMAGE_TAG:-latest}
    container_name: idurar-frontend
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
      REACT_APP_NEST_API_URL: http://localhost:8888
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - idurar-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Nest.js Integration API
  nest-integration-api:
    image: ${REGISTRY_USERNAME:-tonykuriakose}/nest-integration-api:${IMAGE_TAG:-latest}
    container_name: nest-integration-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:${MONGO_ROOT_PASSWORD:-secure_password}@mongodb:27017/idurar?authSource=admin
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 8888
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8888:8888"
    networks:
      - idurar-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/integration/reports/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Next.js Projects CRUD
  nextjs-projects-crud:
    image: ${REGISTRY_USERNAME:-tonykuriakose}/nextjs-projects-crud:${IMAGE_TAG:-latest}
    container_name: nextjs-projects-crud
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://admin:${MONGO_ROOT_PASSWORD:-secure_password}@mongodb:27017/idurar?authSource=admin
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3001:3000"
    networks:
      - idurar-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: idurar-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - nest-integration-api
      - nextjs-projects-crud
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - idurar-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  idurar-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ---
# .env.production.example
# MONGO_ROOT_PASSWORD=your_secure_mongo_password
# REDIS_PASSWORD=your_secure_redis_password
# GEMINI_API_KEY=your_gemini_api_key
# JWT_SECRET=your_super_secure_jwt_secret_with_at_least_32_characters
# REGISTRY_USERNAME=your_docker_hub_username
# IMAGE_TAG=latest