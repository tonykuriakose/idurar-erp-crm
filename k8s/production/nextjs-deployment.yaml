# k8s/production/nextjs-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-deployment
  namespace: production
  labels:
    app: nextjs-crud
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs-crud
  template:
    metadata:
      labels:
        app: nextjs-crud
        version: v1
    spec:
      containers:
      - name: nextjs-crud
        image: {{NEXTJS_IMAGE}}
        ports:
        - containerPort: 3000
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGODB_URI
        livenessProbe:
          httpGet:
            path: /api/projects
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/projects
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
